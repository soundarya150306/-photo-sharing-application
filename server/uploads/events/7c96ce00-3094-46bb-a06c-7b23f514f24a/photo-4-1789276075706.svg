
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#78350f;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
      </linearGradient>
      <radialGradient id="bokeh1" cx="30%" cy="30%" r="40%">
        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
        <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
      </radialGradient>
      <radialGradient id="bokeh2" cx="70%" cy="70%" r="50%">
        <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.2" />
        <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0" />
      </radialGradient>
      <filter id="blurFilter">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>
    
    <!-- Background Gradient -->
    <rect width="1200" height="800" fill="url(#grad)" />
    
    <!-- Bokeh Lighting Effects -->
    <circle cx="360" cy="240" r="280" fill="url(#bokeh1)" filter="url(#blurFilter)" />
    <circle cx="840" cy="560" r="320" fill="url(#bokeh2)" filter="url(#blurFilter)" />
    <circle cx="950" cy="180" r="140" fill="url(#bokeh1)" />
    <circle cx="180" cy="620" r="160" fill="url(#bokeh2)" />

    <!-- Stylized Frame & Grid -->
    <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" rx="12" />
    <circle cx="600" cy="380" r="110" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
    
    <!-- Camera Aperture Icon Graphic -->
    <g transform="translate(560, 340) scale(1.6)" fill="#ffffff" fill-opacity="0.85">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
    </g>

    <!-- Typography -->
    <text x="600" y="520" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ROYAL MANDAP SEVEN SACRED VOWS
    </text>
    <text x="600" y="565" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#f3f4f6" text-anchor="middle" letter-spacing="3" opacity="0.9">
      PHERAS • LUMINA CAPTURE
    </text>

    <!-- Corner watermark badge -->
    <rect x="70" y="70" width="130" height="32" rx="6" fill="#000000" fill-opacity="0.4" />
    <text x="135" y="91" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      PRO RAW
    </text>
    
    <text x="1100" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#ffffff" opacity="0.6" text-anchor="end">
      ISO 100 • 50mm f/1.4 • 1/1000s
    </text>
  </svg>
  